name: Chrome Web Store Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check manifest version
        run: npm run version:check

      - name: Check release tag version
        run: npm run release:check-tag

      - name: Run tests
        run: npm test

      - name: Run type check
        run: npm run lint

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run package

      - name: Resolve package path
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Filter "synology-download-station-extension-*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Release zip not found."
          }
          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "${{ steps.package.outputs.zip_path }}" --clobber
          } else {
            gh release create $tag "${{ steps.package.outputs.zip_path }}" --title $tag --notes "Chrome extension package for $tag."
          }

      - name: Check Chrome Web Store secrets
        id: cws_secrets
        shell: pwsh
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          $serviceAccountConfigured = [bool]$env:CWS_SERVICE_ACCOUNT_JSON -and [bool]$env:CWS_PUBLISHER_ID
          $oauthConfigured = [bool]$env:CWS_CLIENT_ID -and [bool]$env:CWS_CLIENT_SECRET -and [bool]$env:CWS_REFRESH_TOKEN -and [bool]$env:CWS_PUBLISHER_ID
          $configured = $serviceAccountConfigured -or $oauthConfigured
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish to Chrome Web Store
        if: ${{ steps.cws_secrets.outputs.configured == 'true' }}
        run: npm run publish:cws
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

      - name: Skip Chrome Web Store publish
        if: ${{ steps.cws_secrets.outputs.configured != 'true' }}
        run: |
          echo "Chrome Web Store publish skipped because one or more CWS_* repository secrets are missing."
          echo "Configure CWS_SERVICE_ACCOUNT_JSON and CWS_PUBLISHER_ID, or configure CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, and CWS_PUBLISHER_ID."
